[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medextract"
version = "0.1.0"
description = "Biomedical named entity extraction and retrieval service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

# Everything needed to fine-tune, evaluate and export a model. Not installed
# into the serving image -- the API only needs `serve`.
[project.optional-dependencies]
train = [
    "torch>=2.2",
    # Both transformers lines work. The tokenizer guard checks for word_ids()
    # and an offset mapping directly rather than trusting is_fast, and the
    # ONNX exporter hands 5.x a prepared attention mask its tracer-unfriendly
    # mask builder returns untouched. The serving image pins the 5.x line in
    # requirements-serve.txt; see docs/SECURITY.md for why.
    "transformers>=4.40,<6",
    "datasets>=2.18",
    "accelerate>=0.29",
    "mlflow>=2.12",
    "optimum[onnxruntime]>=1.19",
]
serve = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "transformers>=4.40,<6",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
medextract-train = "medextract.train:main"
medextract-sweep = "medextract.sweep:main"
medextract-export = "medextract.export_onnx:main"
medextract-benchmark = "medextract.benchmark:main"
medextract-fetch-pubmed = "medextract.retrieval.pubmed:main"
medextract-index = "medextract.retrieval.build_index:main"
medextract-pipeline = "medextract.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs network or a real fine-tuned model; skipped by default in CI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
