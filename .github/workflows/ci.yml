name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The CPU torch index keeps the runner from pulling ~2.5GB of CUDA
        # wheels it can never use.
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # transformers>=5 made every tokenizer report is_fast=True, which
          # breaks the fast-tokenizer guard in data.py -- see pyproject.toml.
          pip install -e ".[dev]" onnx onnxruntime "transformers<5" qdrant-client httpx

      - name: pytest
        run: pytest -q --cov=medextract --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ghcr.io repository names must be lowercase; github.repository preserves
      # the owner's actual case (SilverKai13), so it can't be used as-is.
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size against the 1.5GB budget
        # A size regression is the kind of thing that only gets noticed at
        # deploy time otherwise, so it fails the build here instead.
        run: |
          BYTES=$(docker image inspect ${{ env.IMAGE_NAME }}:ci --format '{{.Size}}')
          MB=$((BYTES / 1000000))
          echo "image size: ${MB} MB"
          echo "### Image size: ${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt 1500 ]; then
            echo "::error::image is ${MB} MB, over the 1500 MB budget"
            exit 1
          fi

      - name: Smoke test the container
        # Starts with no model mounted, so this asserts the container comes up
        # and reports itself degraded rather than crash-looping.
        run: |
          docker run -d --name medextract-smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status"' /tmp/health.json
          docker rm -f medextract-smoke

  publish:
    # Only tagged releases push an image; branch builds stop at `build`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
